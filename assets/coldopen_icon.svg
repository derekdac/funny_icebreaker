<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep midnight indigo background -->
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#23295A"/>
      <stop offset="55%" stop-color="#141838"/>
      <stop offset="100%" stop-color="#0B0E24"/>
    </radialGradient>

    <!-- Warm burst glow behind the crack -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE066" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FF7B54" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FF4D6D" stop-opacity="0"/>
    </radialGradient>

    <!-- Ice cube facets -->
    <linearGradient id="iceTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FF"/>
      <stop offset="50%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="iceLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="iceRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Golden-coral comedy spark gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="45%" stop-color="#FFC300"/>
      <stop offset="100%" stop-color="#FF5E5B"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#040717" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Ambient warm burst aura -->
  <circle cx="256" cy="252" r="195" fill="url(#sparkGlow)"/>

  <!-- Left half of the cracked isometric ice cube (shifted slightly left/down) -->
  <g filter="url(#softShadow)" transform="translate(-14, 10) rotate(-4 220 260)">
    <!-- Left top facet -->
    <polygon points="246,112 116,184 218,242 252,190 236,154" fill="url(#iceTop)" stroke="#E0F7FF" stroke-width="3" stroke-linejoin="round"/>
    <!-- Left front-left facet -->
    <polygon points="116,184 116,330 226,392 232,312 212,276 218,242" fill="url(#iceLeft)" stroke="#BAE6FD" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Inner fracture highlight -->
    <polyline points="246,112 236,154 252,190 218,242 212,276 232,312 226,392" fill="none" stroke="#FFF3B0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right half of the cracked isometric ice cube (shifted slightly right/up) -->
  <g filter="url(#softShadow)" transform="translate(16, -10) rotate(5 292 250)">
    <!-- Right top facet -->
    <polygon points="274,114 396,184 294,242 278,192 262,156" fill="url(#iceTop)" stroke="#E0F7FF" stroke-width="3" stroke-linejoin="round"/>
    <!-- Right front-right facet -->
    <polygon points="396,184 396,330 282,394 286,314 268,278 294,242" fill="url(#iceRight)" stroke="#BAE6FD" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Inner fracture highlight -->
    <polyline points="274,114 262,156 278,192 294,242 268,278 286,314 282,394" fill="none" stroke="#FFF3B0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Flying crystal ice shards -->
  <polygon points="88,136 112,120 106,150" fill="#BAE6FD" opacity="0.9"/>
  <polygon points="418,132 442,148 412,158" fill="#7DD3FC" opacity="0.85"/>
  <polygon points="408,368 432,382 406,396" fill="#38BDF8" opacity="0.75"/>
  <polygon points="94,358 114,376 86,384" fill="#7DD3FC" opacity="0.75"/>

  <!-- Radiant 4-point comedy spark bursting from the center crack -->
  <g filter="url(#softShadow)">
    <path d="M256,144 C264,218 286,240 360,248 C286,256 264,278 256,352 C248,278 226,256 152,248 C226,240 248,218 256,144 Z" fill="url(#sparkGrad)"/>
    <!-- Bright white-gold core -->
    <path d="M256,192 C261,232 272,243 312,248 C272,253 261,264 256,304 C251,264 240,253 200,248 C240,243 251,232 256,192 Z" fill="#FFFDF0"/>
  </g>

  <!-- Playful satellite sparkles -->
  <circle cx="170" cy="112" r="8" fill="#FFE066"/>
  <circle cx="352" cy="108" r="6" fill="#FF7B54"/>
  <circle cx="348" cy="396" r="7" fill="#FFE066"/>
  <circle cx="158" cy="402" r="5" fill="#7DD3FC"/>
</svg>
