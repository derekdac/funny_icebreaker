[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coldopen"
version = "0.1.0"
description = "Multi-agent ADK meeting icebreaker and game-show deck producer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk[gcp,otel-gcp]>=2.12.0,<3.0.0",
    "google-genai>=1.0.0",
    "a2ui-agent-sdk>=0.1.0",
    "a2ui-adk>=0.1.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-dlp>=3.18.0",
    "pydantic>=2.7.0",
    "python-pptx>=1.0.2",
    "httpx>=0.27.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "gcsfs>=2026.10.0",
    "aiohttp>=3.13.4",
    "google-cloud-aiplatform>=1.129.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.setuptools.packages.find]
include = ["coldopen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
